[project]
name = "agentforge"
version = "0.1.0"
description = "A multi-agent workflow system: planner, researcher, executor and critic wired as an explicit LangGraph state machine."
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.28",
  "langchain-core>=0.3.0",
  "pydantic>=2.7",
  # Serving deps live in the base set because Vercel's Python builder resolves
  # from pyproject.toml and does not read the optional-dependency extras.
  "fastapi>=0.115",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
anthropic = ["langchain-anthropic>=0.2.0"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
store = ["redis>=5.0", "psycopg[binary]>=3.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
agentforge = "agentforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
